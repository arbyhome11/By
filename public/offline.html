<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline | Me & You</title>
    <style>
      :root {
        --bg-warm: #FAF7F2;
        --color-terracotta: #C85A32;
        --color-rose: #FB7185;
        --color-text: #292524;
        --color-muted: #78716C;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-warm: #1C1917;
          --color-text: #F5F5F4;
          --color-muted: #A8A29E;
        }
      }
      body {
        margin: 0;
        padding: 24px;
        background-color: var(--bg-warm);
        color: var(--color-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        box-sizing: border-box;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .heart-card {
        background: rgba(200, 90, 50, 0.08);
        border: 1px solid rgba(200, 90, 50, 0.2);
        padding: 32px 24px;
        border-radius: 28px;
        max-width: 360px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(200, 90, 50, 0.1);
      }
      .heart-icon {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
        animation: pulse 2.2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 10px 0;
        color: var(--color-terracotta);
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: var(--color-muted);
        margin: 0 0 24px 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: var(--color-terracotta);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 9999px;
        text-decoration: none;
        cursor: pointer;
        border: none;
        min-height: 44px;
        min-width: 44px;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .btn:active {
        transform: scale(0.97);
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="heart-card">
      <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="#C85A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" fill="#FB7185" fill-opacity="0.3" />
      </svg>
      <h1>You're offline</h1>
      <p>Your reunion is still coming. Any new journal entries, checked plans, and dates you change will automatically sync when you reconnect.</p>
      <button class="btn" onclick="window.location.reload()">Try Reconnecting</button>
    </div>
  </body>
</html>
